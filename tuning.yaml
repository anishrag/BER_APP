# Runtime tuning for the new-storey (method 2) splice and the collinearity
# review. Edit and restart the app — no recompile needed. Any key omitted falls
# back to its built-in default; a missing/invalid file uses all defaults.
#
# Override the path with the BER_TUNING environment variable.
#
# "ratio" values are fractions of the relevant bounding-box DIAGONAL (so they
# scale with storey size); "_m" values are absolute metres; factors multiply
# another tolerance.

new_storey:
  # Snap radius for pulling a traced point onto the previous outline. (The new
  # storey is otherwise traced through the living-area carve — see `subarea`.)
  snap_tol_ratio: 0.08

  # View zoom when an upper storey is added (1.0 = pure auto-fit; <1 zooms out
  # to leave room to draw past the previous footprint).
  add_storey_zoom: 0.7

collinearity:
  # A near-collinear edge pair is offered for review when the perpendicular gap
  # between them is between min and max (fractions of the plan diagonal).
  min_separation_ratio: 0.0015
  max_separation_ratio: 0.09

subarea:
  # Living-area / construction-phase-area carve.
  # A stroke is a CLOSED loop when its first and last points are within this
  # many metres (sub-areas are drawn on a dimensioned outline -> absolute).
  close_gap_m: 0.7

  # Boundary-follow classifier band (fractions of the plan diagonal): a stroke
  # point hugs the wall when within on_ratio of it, and has left past off_ratio
  # (off_ratio > on_ratio = hysteresis). Higher on_ratio snaps to the wall more
  # eagerly -- catches loose curve-hugs, but pins interior walls drawn near it.
  on_ratio: 0.035
  off_ratio: 0.09
  # Absolute ceilings (metres) on the band above, so a LARGE region doesn't
  # inflate it: a 5 m region would give off_tol 0.44 m, swallowing an interior
  # wall drawn ~0.4 m off a wall. Caps keep the snap band at hand-precision.
  on_tol_ceil_m: 0.1
  off_tol_ceil_m: 0.25

  # RDP / orthogonalization tolerance for the carve, as
  # (stroke_diag * rdp_tol_ratio).max(rdp_tol_floor) metres. Higher = the
  # freehand stroke is simplified more coarsely.
  rdp_tol_ratio: 0.02
  rdp_tol_floor: 0.001

  # Straight-cut simplify/orthogonalize tolerance = cut_simplify_ratio * the
  # cut's longest extent (drops wobble), but CEILINGED at cut_simplify_ceil_m
  # metres so a corner that size or larger is always kept even on a long cut.
  simplify_ratio: 0.1
  simplify_ceil_m: 0.7

  # Cut endpoints: snap onto an outline vertex within diag * cut_vertex_tol_ratio;
  # accept the cut only if both ends reach the outline within diag * cut_reach_tol_ratio.
  cut_vertex_tol_ratio: 0.03
  cut_reach_tol_ratio: 0.06

  # A boundary-follow hug transition (where the stroke peels off a wall) snaps to
  # an outline CORNER within this many metres -- so a carve that hugs a wall up to
  # a corner reaches it exactly instead of stopping a hand-width short.
  corner_snap_m: 0.15
