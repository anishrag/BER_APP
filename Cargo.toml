[package]
name = "ber_app"
version = "0.0.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# cdylib for the Android entry (android-activity glue loads the app as a
# shared library); rlib so the desktop binary keeps consuming the lib crate.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
log = "0.4.27"
env_logger = "0.11"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
anyhow = "1.0"
chrono = { version = "0.4.42", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = "0.9"
geo = "0.32.0"
earcutr = "0.5.0"
datatypes = { path = "datatypes" }
document = { path = "document" }
domain = { path = "domain" }
manip_plan = { path = "manip_plan", features = ["serde"] }
sketch = { path = "sketch" }
egui = "0.33.3"
strum = "0.27.2"
strum_macros = "0.27.2"
egui_extras = { version = "0.33.3", features = ["datepicker"] }

# Bluetooth laser meter (Leica DISTO) support — behind the `bluetooth` feature
# (off by default so the normal build + tests need no radio stack). btleplug is
# the cross-platform BLE crate; on Android it additionally needs the droidplug
# companion + runtime permissions (see android/README.md).
btleplug = { version = "0.11", optional = true }
tokio = { version = "1", features = ["rt", "time", "macros"], optional = true }
futures = { version = "0.3", optional = true }

[features]
bluetooth = ["dep:btleplug", "dep:tokio", "dep:futures"]

# eframe is split per-target: desktop keeps the full default feature set
# (accesskit, x11, wayland, glow). On android `accesskit` is rejected unless
# you use android-game-activity, and x11/wayland are desktop-only — so the
# android build opts out of defaults and re-adds only what it needs.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = "0.33.3"

# Android entry-point deps. `AndroidApp` is always named THROUGH winit
# (`winit::platform::android::activity::AndroidApp`) so the android-activity
# version is the one winit links — never depend on android-activity directly.
[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
eframe = { version = "0.33.3", default-features = false, features = [
    "android-native-activity",
    "glow",
    "default_fonts",
] }
android_logger = "0.15"

[workspace]
members = ["datatypes", "document", "sketch", "domain", "manip_plan"]

[workspace.dependencies]
# float_roundtrip: the BER blob round-trips f64 geometry through JSON — without
# it serde_json's fast float parse can be 1 ulp off, breaking the reload
# fixpoint for drawn (non-exact) coordinates (e.g. roof-rect corners). Hoisted
# to the workspace so every member (and a standalone `cargo test -p document`)
# gets the same parser — declare it as `serde_json = { workspace = true }`.
serde_json = { version = "1.0.145", features = ["float_roundtrip"] }
