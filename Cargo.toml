[package]
name = "ber_app"
version = "0.0.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = "0.4.27"
env_logger = "0.11"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
anyhow = "1.0"
chrono = { version = "0.4.42", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9"
geo = "0.32.0"
earcutr = "0.5.0"
datatypes = { path = "datatypes" }
document = { path = "document" }
domain = { path = "domain" }
manip_2d_plan = { path = "manip_2d_plan", features = ["serde"] }
sketch = { path = "sketch" }
eframe = "0.33.3"
egui = "0.33.3"
strum = "0.27.2"
strum_macros = "0.27.2"
egui_extras = { version = "0.33.3", features = ["datepicker"] }

[workspace]
members = ["datatypes", "document", "gen_3d_vol", "sketch", "domain", "manip_2d_plan"]
