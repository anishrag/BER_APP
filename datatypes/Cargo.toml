[package]
name = "datatypes"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
geo = { version = "0.32.0", features = ["serde"] }
nalgebra = { version = "0.34.1", features = ["serde-serialize"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.6", features = ["serde", "v4"] }
