[package]
name = "datatypes"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
geo = { version = "0.32.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.6", features = ["serde", "v4"] }
domain = { path = "../domain" }

[dev-dependencies]
serde_json = "1.0"
