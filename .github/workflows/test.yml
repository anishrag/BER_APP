name: Tests

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # eframe/winit need these to link on Linux. Tests don't open a window,
      # but the crates still link against system libs at compile time.
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo test --workspace
        run: cargo test --workspace --no-fail-fast

  boundaries:
    name: Architecture boundary check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run boundary linter over the working tree
        run: |
          # Scan every .rs file in-repo (not just modified ones, since CI runs on full checkout)
          find . -name '*.rs' -not -path './target/*' -print0 | \
            xargs -0 -n1 .claude/scripts/check-boundaries.sh
