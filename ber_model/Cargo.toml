[package]
name = "ber_model"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
geo = { version = "0.32.0", features = ["serde"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.6", features = ["serde", "v4"] }
domain = { path = "../domain" }
# Owns the 3D polygon kernel (Polygon3D) re-exported from ber::structural;
# serde feature on so the serialized region types keep their derives.
manip_plan = { path = "../manip_plan", features = ["serde"] }

[dev-dependencies]
serde_json = { workspace = true }
