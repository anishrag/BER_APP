[package]
name = "manip_2d_plan"
version = "0.1.0"
edition = "2021"
description = "Hand-drawn floor-plan strokes → orthogonal parametric polygons"
license = "MIT OR Apache-2.0"

[dependencies]
geo = "0.32"
geo-types = "0.7"
serde = { version = "1.0", features = ["derive"], optional = true }
thiserror = "2.0"
log = "0.4"
domain = { path = "../domain" }

[features]
default = []
serde = ["dep:serde", "geo/serde", "geo-types/serde"]

[dev-dependencies]
serde_json = "1.0"
