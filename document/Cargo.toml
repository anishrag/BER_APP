[package]
name = "document"
version = "0.1.0"
edition = "2021"
description = "The editable BER storey model — UI-free, DB-free; the editing logic behind the app shell"
license = "MIT OR Apache-2.0"

[dependencies]
domain = { path = "../domain" }
ber_model = { path = "../ber_model" }
manip_plan = { path = "../manip_plan", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
geo = { version = "0.32.0", features = ["serde"] }
log = "0.4"

[dev-dependencies]
serde_json = { workspace = true }
